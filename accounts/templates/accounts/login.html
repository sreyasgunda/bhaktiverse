<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BhaktiVerse - Devotee Log In</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --accent-color: #f59e0b; /* Golden saffron */
            --accent-hover: #d97706;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-primary: #f8fafc;
            --text-secondary: #cbd5e1;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 0;
            overflow-x: hidden;
            position: relative;
        }

        /* Decorative background elements */
        .decor-circle-1 {
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(245, 158, 11, 0.15) 0%, rgba(245, 158, 11, 0) 70%);
            top: -50px;
            right: -50px;
            z-index: 0;
        }

        .decor-circle-2 {
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, rgba(99, 102, 241, 0) 70%);
            bottom: -100px;
            left: -100px;
            z-index: 0;
        }

        .login-container {
            z-index: 10;
            width: 100%;
            max-width: 480px;
            padding: 15px;
        }

        .login-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            padding: 3rem;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .brand-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .brand-logo {
            font-size: 2.8rem;
            font-weight: 700;
            background: linear-gradient(to right, #f59e0b, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
            letter-spacing: -1px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .brand-logo i {
            color: #f59e0b;
            -webkit-text-fill-color: initial;
        }

        .brand-subtitle {
            color: var(--text-secondary);
            font-size: 1rem;
            font-weight: 300;
        }

        .form-label {
            font-weight: 500;
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }

        .form-control {
            background: rgba(15, 23, 42, 0.6) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            color: var(--text-primary) !important;
            border-radius: 12px;
            padding: 0.75rem 1rem;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            border-color: var(--accent-color) !important;
            box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.15) !important;
            outline: none;
        }

        .form-control::placeholder {
            color: #64748b !important;
        }

        .btn-login {
            background: linear-gradient(135deg, var(--accent-color) 0%, #d97706 100%);
            border: none;
            border-radius: 12px;
            padding: 0.85rem;
            font-weight: 600;
            font-size: 1rem;
            color: #0f172a;
            width: 100%;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3);
            margin-top: 1.5rem;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(245, 158, 11, 0.5);
            background: linear-gradient(135deg, #fbbf24 0%, var(--accent-hover) 100%);
            color: #0f172a;
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .register-link {
            text-align: center;
            margin-top: 1.5rem;
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .register-link a {
            color: var(--accent-color);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s ease;
        }

        .register-link a:hover {
            color: #fbbf24;
            text-decoration: underline;
        }

        .alert-danger {
            background: rgba(220, 38, 38, 0.2);
            border: 1px solid rgba(220, 38, 38, 0.4);
            color: #fca5a5;
            border-radius: 12px;
            padding: 1rem;
            margin-bottom: 2rem;
        }
    </style>
</head>
<body>

    <div class="decor-circle-1"></div>
    <div class="decor-circle-2"></div>

    <div class="login-container">
        <div class="login-card">
            <div class="brand-header">
                <div class="brand-logo">
                    <i class="fa-solid fa-om"></i> BhaktiVerse
                </div>
                <div class="brand-subtitle">Elevate Your Sadhana, Connect with Your Sangha</div>
            </div>

            {% if error_message %}
                <div class="alert alert-danger">
                    <i class="fa-solid fa-triangle-exclamation me-2"></i> {{ error_message }}
                </div>
            {% endif %}

            <form method="POST" novalidate>
                {% csrf_token %}
                
                <!-- Email/Username -->
                <div class="mb-3">
                    <label for="id_username" class="form-label">
                        <i class="fa-regular fa-envelope me-1 text-warning"></i> Email Address
                    </label>
                    <input type="email" name="username" id="id_username" class="form-control" placeholder="e.g. devotee@bhaktiverse.org" required>
                </div>

                <!-- Password -->
                <div class="mb-3">
                    <label for="id_password" class="form-label">
                        <i class="fa-solid fa-lock me-1 text-warning"></i> Password
                    </label>
                    <input type="password" name="password" id="id_password" class="form-control" placeholder="Enter your password" required>
                </div>

                <button type="submit" class="btn btn-login">
                    <i class="fa-solid fa-arrow-right-to-bracket me-2"></i> Log In
                </button>
            </form>

            <div class="register-link">
                New to BhaktiVerse? <a href="{% url 'register' %}">Register Here <i class="fa-solid fa-user-plus ms-1"></i></a>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
